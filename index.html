<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Soneca</title>
<style>
:root{--bg:#f4f2fc;--cd:#fff;--cs:#eeeafc;--tx:#17142f;--mu:#6b6691;--ac:#6556f0;--am:#e8871f;--bd:#e2def4;--c0:#f08a5d;--c1:#2fb0e8;--c2:#8a94f5;--c3:#4a3bb8;--sky:linear-gradient(180deg,#e6e1fb,#f4f2fc 45%);--gl:linear-gradient(135deg,#6556f0,#a36cf5 60%,#f2994a);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0818;--cd:#15122d;--cs:#1e1a42;--tx:#eeebff;--mu:#9b96c8;--ac:#8f82ff;--am:#ffb766;--bd:#29255a;--c3:#6b5cf2;--sky:radial-gradient(110% 55% at 50% -8%,#2b2070,#0a0818 62%)}}
:root[data-theme="dark"]{--bg:#0a0818;--cd:#15122d;--cs:#1e1a42;--tx:#eeebff;--mu:#9b96c8;--ac:#8f82ff;--am:#ffb766;--bd:#29255a;--c3:#6b5cf2;--sky:radial-gradient(110% 55% at 50% -8%,#2b2070,#0a0818 62%)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{background-color:var(--bg);background-image:var(--sky);background-attachment:fixed;color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:92px}
.v{max-width:520px;margin:0 auto;padding:20px 16px}.v[hidden]{display:none}
h1{font-size:30px;font-weight:650;letter-spacing:-.02em;margin:0}h2{font-size:22px;font-weight:600;margin:0 0 8px}.mu{color:var(--mu)}.sm{font-size:13px}
.hd{display:flex;justify-content:space-between;align-items:center}.hd p{margin:2px 0 0}.lg{font-size:34px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:24px;padding:18px;margin:14px 0;box-shadow:0 10px 30px #0000000f}
.tfs{display:flex;gap:10px;margin:6px 0 12px}.tf{flex:1;background:var(--cs);border-radius:18px;padding:10px 14px;text-align:left;display:block}.tf span{font-size:13px;color:var(--mu)}
input[type=time]{display:block;width:100%;background:none;border:0;color:var(--tx);font:300 30px system-ui;padding:2px 0;font-variant-numeric:tabular-nums}
select{background:var(--cs);color:var(--tx);border:0;border-radius:12px;padding:9px 12px;font:inherit}
.rw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--bd)}.rw:first-child{border:0;padding-top:0}.rw:last-child{padding-bottom:0}
input[type=range]{accent-color:var(--ac);width:150px}
button{font:inherit;color:var(--tx);cursor:pointer;border:1px solid var(--bd);background:var(--cd);border-radius:16px;padding:14px;width:100%;margin:6px 0}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.b1{background:var(--gl);color:#fff;border:0;font-weight:650;font-size:17px;padding:17px;border-radius:20px;box-shadow:0 10px 26px #6556f058}.b3{background:none;border:0;color:var(--mu)}
.chip{width:auto;display:inline-block;background:var(--cs);border:0;border-radius:99px;padding:9px 16px;font-size:14px;color:var(--ac);margin:0}
.ic{width:38px;height:38px;padding:0;border-radius:50%;margin:0 0 0 8px}
.dys{display:flex;justify-content:space-between;margin:10px 0 6px}.dy{width:40px;height:40px;padding:0;margin:0;border-radius:50%;background:var(--cs);border:0;color:var(--mu);font-weight:600}.dy.on{background:var(--ac);color:#fff}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.gr button{margin:0;padding:22px 8px;font-size:15px;border-radius:22px}.gr button.on{background:var(--gl);color:#fff;border:0}.gr b{display:block;font-size:32px;font-weight:400}
nav{position:fixed;left:0;right:0;bottom:0;z-index:3;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));backdrop-filter:blur(14px)}nav[hidden]{display:none}
nav button{border:0;background:none;margin:0;padding:6px;color:var(--mu);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}nav svg{width:24px;height:24px}nav button.on{color:var(--ac);font-weight:700}
#mon{position:fixed;inset:0;z-index:5;overflow:auto;color:#cfcaf5;background:radial-gradient(110% 60% at 50% 0%,#241a63,#05040d 65%);--mu:#8782b5;--bd:#241f4a;--cd:#0e0b24;--tx:#eeebff;padding-top:env(safe-area-inset-top,0px)}
#clk{font-size:92px;font-weight:200;letter-spacing:-.03em;text-align:center;margin:30px 0 0;color:#f1eeff;font-variant-numeric:tabular-nums}
.pill{display:flex;justify-content:center;align-items:center;gap:8px;margin:14px 0}.pill i{width:10px;height:10px;border-radius:50%}
.ch{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.ch span{border:1px solid var(--bd);border-radius:99px;padding:3px 11px;font-size:13px}
#rg{text-align:center;padding-top:36px;font-size:64px}#rg h2{font-size:38px;font-weight:300;color:#ffd9a8;margin:6px 0}#rg p{font-size:16px;margin:0 0 18px}
.tg{display:flex;gap:8px;flex-wrap:wrap}.tg button{width:auto;padding:8px 14px;border-radius:99px;font-size:14px;margin:0}.tg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.st{display:flex;gap:10px}.st div{flex:1}.st b{display:block;font-size:26px;font-weight:300}
.bar{height:8px;border-radius:9px;background:var(--bd);overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%}
.it{display:flex;justify-content:space-between;align-items:center;text-align:left;border-radius:18px}
#tt{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:14px;z-index:9;font-size:14px;max-width:90%}
@media(prefers-reduced-motion:no-preference){.b1{transition:transform .15s}.b1:active{transform:scale(.98)}}
.fn{display:flex;gap:10px;justify-content:center;margin:8px 0}
</style></head><body>
<main id="home" class="v">
<div class="hd"><div><h1>Soneca</h1><p class="mu sm" id="nx"></p></div><span class="lg">🌙</span></div>
<div class="cd" style="text-align:center"><div id="dial"></div>
<input id="al" type="time" hidden><p class="mu sm" style="margin:0">Arraste o ☀️ no círculo para ajustar o alarme</p>
<div class="fn"><button class="chip" onclick="nud(-1)">−1 min</button><button class="chip" onclick="nud(1)">+1 min</button></div><p id="sg" class="mu sm" style="margin:0"></p></div>
<div class="cd"><div class="mu sm">Repetir</div><div class="dys" id="dys"></div><div class="mu sm" id="dsm"></div></div>
<div class="cd"><div class="rw"><span>Alarme inteligente</span><select id="win"><option value="0">Desligado</option><option value="15">15 min</option><option value="30">30 min</option><option value="45">45 min</option></select></div>
<div class="rw"><span>Som</span><span><select id="snd"><option value="amanhecer">Amanhecer</option><option value="sino">Sino</option><option value="pulso">Pulso</option></select><button class="ic" onclick="tst()" aria-label="Ouvir">▶</button></span></div>
<div class="rw"><span>Volume</span><input id="vol" type="range" min="40" max="100" step="10"></div>
<div class="rw"><span>Soneca</span><select id="sn"><option value="5">5 min</option><option value="9">9 min</option><option value="15">15 min</option></select></div>
<div class="rw"><span>Meta de sono</span><select id="gl"><option>6</option><option>7</option><option>7.5</option><option>8</option><option>9</option></select></div></div>
<p id="wb" class="mu sm" hidden></p>
<button class="b1" onclick="go(0)">Iniciar sono</button><button class="b3" onclick="go(1)">Ver uma noite simulada</button>
</main>
<main id="sons" class="v" hidden><h1>Sons para dormir</h1><p class="mu sm">Ruídos gerados no aparelho, sem internet. Com som ligado, a detecção de roncos fica menos precisa.</p>
<div class="gr" id="gr"></div><div class="cd"><div class="rw"><span>Desligar após</span><select id="st"><option value="15">15 min</option><option value="30">30 min</option><option value="60">1 hora</option><option value="0">Sem timer</option></select></div></div></main>
<main id="mon" hidden><div class="v"><div id="clk">--:--</div><p id="inf" class="mu" style="text-align:center;margin:0"></p><div id="stg" class="pill"></div><div class="ch" id="chp"></div><div class="cd" id="lh"></div>
<div id="rg" hidden>☀️<h2>Bom dia</h2><p>Hora de acordar.</p><button class="b1" onclick="fim()">Desligar</button><button class="b3" onclick="soneca()">Soneca</button></div>
<button id="stp" class="b3" onclick="fim()" style="margin-top:24px">Parar e ver o resultado</button></div></main>
<main id="res" class="v" hidden></main><main id="his" class="v" hidden></main>
<nav><button id="n1" class="on" onclick="show('home')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>Alarme</button><button id="n2" onclick="show('sons')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 8c3-3 5 3 8 0s5 3 8 0 3 0 4-1M2 16c3-3 5 3 8 0s5 3 8 0 3 0 4-1"/></svg>Sons</button><button id="n3" onclick="hist_()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Histórico</button></nav>
<script>
const $=s=>document.querySelector(s),NM=['Acordado','REM','Leve','Profundo'],C=['var(--c0)','var(--c1)','var(--c2)','var(--c3)'];
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let S=ld('cfg',{al:'07:00',win:30,snd:'amanhecer',gl:8}),H=ld('hist',[]),N=null,cur=null,tm,AC,mg,rt,WL,an,buf,pA,pL=0,mA=0,mN=0,base=0;const R={mic:0,mot:0,st:null};
$('#al').value=S.al;$('#win').value=S.win;$('#snd').value=S.snd;$('#gl').value=S.gl;
['al','win','snd','gl'].forEach(k=>$('#'+(k=='al'?'al':k)).onchange=e=>{S[k]=k=='al'||k=='snd'?e.target.value:+e.target.value;sv('cfg',S)});
const fm=m=>Math.floor(m/60)+'h'+String(Math.round(m%60)).padStart(2,'0'),hr=t=>new Date(t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
function toast(m){let t=$('#tt');if(t)t.remove();t=document.createElement('div');t.id='tt';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3500)}
function show(v){['home','mon','res','his'].forEach(x=>$('#'+x).hidden=x!=v);$('#n1').className=v=='home'?'on':'';$('#n2').className=v=='his'?'on':'';scrollTo(0,0)}
/* áudio */
const ac=()=>{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();return AC};
function nt(f,t,d,ty,v){const c=ac(),o=c.createOscillator(),g=c.createGain();o.type=ty;o.frequency.value=f;o.connect(g);g.connect(mg);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.06);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d)}
const P={amanhecer:()=>[523,659,784,1047].forEach((f,i)=>nt(f,AC.currentTime+i*.55,2.6,'sine',.3)),sino:()=>[880,1320,1760].forEach((f,i)=>nt(f,AC.currentTime,2.2,'triangle',.22/(i+1))),pulso:()=>[0,.3,.6].forEach(d=>nt(660,AC.currentTime+d,.2,'square',.1))};
function wring(pv){const c=ac();hush();mg=c.createGain();mg.connect(c.destination);mg.gain.setValueAtTime(.04,c.currentTime);mg.gain.linearRampToValueAtTime(pv?.7:1,c.currentTime+(pv?2:45));P[S.snd]();rt=setInterval(()=>{P[S.snd]();navigator.vibrate&&navigator.vibrate(300)},3000)}
function whush(){clearInterval(rt);try{mg.disconnect()}catch(e){}}
function tst(){ring(1);setTimeout(hush,6000)}
/* sensores */
async function sens(){
try{const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false}}),c=ac();an=c.createAnalyser();an.fftSize=1024;buf=new Float32Array(1024);c.createMediaStreamSource(s).connect(an);R.mic=1;R.st=s}catch(e){}
try{if(window.DeviceMotionEvent){if(DeviceMotionEvent.requestPermission&&await DeviceMotionEvent.requestPermission()!=='granted')throw 0;addEventListener('devicemotion',mo)}}catch(e){}
try{WL=await navigator.wakeLock.request('screen')}catch(e){}}
function mo(e){const a=e.accelerationIncludingGravity;if(!a||a.x==null)return;R.mot=1;const m=Math.hypot(a.x,a.y,a.z);if(pA!=null){mA+=Math.abs(m-pA);mN++}pA=m}
/* estimativa de fases: 0 acordado, 1 REM, 2 leve, 3 profundo (heurística, não é exame médico) */
function est(t,s,hs){if(t<8)return t<4||(hs&&s>.15)?0:2;if(hs&&s>.55)return 0;if(hs&&s>.22)return 2;const p=(t%90)/90;let b=p<.1?2:p<.5?(t<280?3:2):p<.6?2:1;if(hs&&s>.1&&b==3)b=2;return b}
function tgtT0(){const [h,m]=S.al.split(':'),d=new Date();d.setHours(+h,+m,0,0);if(d<=Date.now()+6e4)d.setDate(d.getDate()+1);return +d}
async function go(sim){
const tg=tgtT();N={sim,tg,ws:tg-S.win*6e4,e:[],sm:0,noise:0,a:0,n:0,ns:0,rung:0,woke:0,t0:sim?tg-(S.gl*60+Math.round(Math.random()*40-20))*6e4:Date.now(),next:Date.now()+6e4,bout:0};
show('mon');$('#rg').hidden=1;$('#stp').hidden=0;$('#chp').innerHTML='';
$('#inf').textContent=(sim?'Simulação · ':'')+'Alarme às '+hr(tg)+(S.win?' · janela desde '+hr(N.ws):'');
if(sim){N.cl=80+Math.random()*25;tm=setInterval(dtick,20)}else{ac();await sens();NAT&&A.schedule({at:N.tg,snd:S.snd,vol:S.vol});tm=setInterval(rtick,1000);try{await document.documentElement.requestFullscreen()}catch(e){}}
draw()}
function rtick(){if(NAT&&N&&!N.rung)A.status().then(r=>{if(r.ringing&&N&&!N.rung){N.rung=1;$('#rg').hidden=0;$('#stp').hidden=1}}).catch(()=>{});let lv=0,tr=0;if(an){an.getFloatTimeDomainData(buf);let q=0;for(const v of buf)q+=v*v;lv=Math.sqrt(q/buf.length);tr=Math.abs(lv-pL);pL=lv;base=base?base*.98+lv*.02:lv}
const mv=mN?mA/mN:0;mA=mN=0;N.a+=Math.min(1,mv/.3)+Math.min(1,tr/.05)*.5;N.n++;if(lv>Math.max(.02,base*3))N.ns++;
while(Date.now()>=N.next){mi(Math.min(1,3*N.a/Math.max(1,N.n)),N.ns>=8);N.a=N.n=N.ns=0;N.next+=6e4}
$('#clk').textContent=hr(Date.now())}
function dtick(){const t=N.e.length,p=(t%N.cl)/N.cl;let s=t<10?0:p<.1?2:p<.5?(t<280?3:2):p<.6?2:1;if(N.aw>0){s=0;N.aw--}else if(t>30&&Math.random()<.008)N.aw=2;
const a=[.85,.12,.3,.03][s]*(.6+Math.random()*.8)+(Math.random()<.04?.3:0);if(!N.bout&&s>1&&Math.random()<.02)N.bout=10+Math.round(Math.random()*15);const nz=N.bout>0&&s>1;if(N.bout)N.bout--;mi(Math.min(1,a),nz);$('#clk').textContent=hr(N.t0+N.e.length*6e4)}
function mi(act,nz){const hs=N.sim||R.mic||R.mot;N.sm=hs?N.sm*.7+act*.3:.12;const t=N.e.length,s=est(t,N.sm,hs);N.e.push(s);if(nz&&s)N.noise++;
const now=N.sim?N.t0+t*6e4:Date.now();$('#chp').innerHTML=N.sim?'<span>Simulação rápida</span>':'<span>'+(R.mic?'Som ativo':'Sem microfone')+'</span><span>'+(R.mot?'Movimento ativo':'Sem movimento')+'</span>';
if(!N.rung&&t>20&&(now>=N.tg||(S.win&&now>=N.ws&&(s==0||s==2)))){N.rung=1;N.woke=Math.max(0,Math.round((N.tg-now)/6e4));if(N.sim)fim();else{ring();$('#rg').hidden=0;$('#stp').hidden=1;navigator.vibrate&&navigator.vibrate([400,200,400])}}
draw()}
function draw(){$('#lh').innerHTML=N.e.length>1?hyp({e:N.e.join('')}):''}
function soneca(){hush();$('#rg').hidden=1;$('#stp').hidden=0;N.tg=N.ws=Date.now()+S.sn*6e4;N.rung=0;NAT&&A.schedule({at:N.tg,snd:S.snd,vol:S.vol});toast('Toca de novo em '+S.sn+' min')}
function fim(){clearInterval(tm);hush();NAT&&A.cancel().catch(()=>{});try{R.st&&R.st.getTracks().forEach(t=>t.stop());removeEventListener('devicemotion',mo);WL&&WL.release();document.fullscreenElement&&document.exitFullscreen()}catch(e){}
R.st=null;if(!N||N.e.length<5){show('home');toast('Sono curto demais para gerar relatório');return}
const n={id:Date.now(),t0:N.t0,e:N.e.join(''),noise:N.noise,gl:S.gl,woke:N.woke,sim:N.sim?1:0,mic:N.sim||R.mic?1:0,tags:[]};n.sc=sc(n);N=null;if(!n.sim){H.unshift(n);H=H.slice(0,60);sv('hist',H)}res(n)}
/* resultados */
function stt(n){const e=[...n.e].map(Number),L=e.length,c=k=>e.filter(x=>x==k).length;return{L,aw:c(0),r:c(1),l:c(2),d:c(3),as:L-c(0),ef:(L-c(0))/L}}
function sc(n){const s=stt(n);return Math.round(45*Math.min(1,s.as/(n.gl*60))+25*s.ef+20*Math.min(1,(s.r+s.d)/(.4*s.as||1))+10*(1-Math.min(1,n.noise/60)))}
function hyp(n){const e=[...n.e].map(Number),L=e.length,W=316,h=28;let r='',i=0;while(i<L){let j=i;while(j<L&&e[j]==e[i])j++;r+=`<rect x="${52+i*W/L}" y="${e[i]*h+4}" width="${Math.max(1.5,(j-i)*W/L)}" height="${h-8}" rx="3" fill="${C[e[i]]}"/>`;i=j}
return `<svg viewBox="0 0 370 ${4*h+22}" width="100%" role="img" aria-label="Gráfico das fases do sono">${NM.map((s,k)=>`<text x="0" y="${k*h+19}" font-size="11" fill="var(--mu)">${s}</text><line x1="52" x2="368" y1="${k*h+h/2+4}" y2="${k*h+h/2+4}" stroke="var(--bd)"/>`).join('')}${r}<text x="52" y="${4*h+16}" font-size="11" fill="var(--mu)">${hr(n.t0)}</text><text x="368" y="${4*h+16}" font-size="11" text-anchor="end" fill="var(--mu)">${hr(n.t0+L*6e4)}</text></svg>`}
const TG=['Café','Álcool','Estresse','Exercício','Tela até tarde','Refeição pesada'];
function res(n,old){cur=n;const s=stt(n),q=n.sc,col=q>=75?'var(--c1)':q>=55?'var(--c2)':'var(--c0)',k=2*Math.PI*44;
const ins=[s.as>=n.gl*60?'Você atingiu a meta de sono.':'Faltaram '+fm(n.gl*60-s.as)+' para a meta de '+n.gl+' h.',n.woke>0?`O alarme tocou ${n.woke} min antes do horário final, em sono leve.`:'',n.mic?(n.noise?n.noise+' min com ruídos ou roncos.':'Noite silenciosa, sem roncos detectados.'):'Sem microfone: roncos não são detectados.'].filter(Boolean);
$('#res').innerHTML=`<button onclick="${old?'hist_()':"show('home')"}" style="width:auto;padding:8px 14px">Fechar</button><h2 style="margin-top:12px">${n.sim?'Noite simulada':new Date(n.t0).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</h2>
<div class="cd it"><svg width="110" height="110" viewBox="0 0 110 110"><circle cx="55" cy="55" r="44" fill="none" stroke="var(--bd)" stroke-width="9"/><circle cx="55" cy="55" r="44" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${k*q/100} ${k}" transform="rotate(-90 55 55)"/><text x="55" y="64" text-anchor="middle" font-size="30" font-family="system-ui,sans-serif" fill="var(--tx)">${q}</text></svg>
<div style="flex:1;padding-left:16px"><b style="font:400 26px system-ui,sans-serif">${fm(s.as)}</b> <span class="mu">dormindo</span><div class="mu sm">Na cama ${fm(s.L)} · eficiência ${Math.round(s.ef*100)}%</div></div></div>
<div class="cd">${hyp(n)}</div>
<div class="cd">${[[3,s.d],[2,s.l],[1,s.r],[0,s.aw]].map(([k,v])=>`<div class="sm" style="display:flex;justify-content:space-between"><span>${NM[k]}</span><span class="mu">${fm(v)} · ${Math.round(v/s.L*100)}%</span></div><div class="bar"><i style="width:${v/s.L*100}%;background:${C[k]}"></i></div>`).join('')}</div>
