name: Build APK
on:
  push:
    branches: [main]
    paths: ['index.html', 'build.sh', '.github/workflows/build-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Versao
        run: echo "VER=1.$((GITHUB_RUN_NUMBER + 6))" >> "$GITHUB_ENV"
      - name: Licencas do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Compilar
        run: bash build.sh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: Soneca ${{ env.VER }}
          files: dist/soneca.apk
